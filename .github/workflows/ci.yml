name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  agent-docs:
    name: Check Agent Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required agent docs exist
        run: |
          missing=0
          for f in documents/SPEC.md documents/BACKLOG.md documents/HANDOFF.md; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          exit $missing

  build-and-test:
    name: Lint, Typecheck, Build, Truth Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate venture data
        run: pnpm validate-ventures

      - name: Check banned phrases
        run: pnpm check-banned-phrases

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
